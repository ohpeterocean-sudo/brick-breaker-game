<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>벽돌깨기 - 순위 시스템</title>
<style>
body { text-align: center; background-color: #f4f4f4; font-family: sans-serif; }
canvas { background: #eee; display: block; margin: 20px auto; border: 2px solid #333; }
input { padding: 10px; font-size: 16px; }
button { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; }
</style>
</head>
<body>
<h1>🧱 벽돌깨기 게임</h1>
<div id="login-section">
<input type="text" id="username" placeholder="이름을 입력하세요">
<button id="start-btn">게임 시작</button>
</div>
<canvas id="gameCanvas" width="480" height="320" style="display:none;"></canvas>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

// 여러분의 Firebase 설정값 적용 완료!
const firebaseConfig = {
apiKey: "AIzaSyCkM-k-OzF9ojiPhdgWZdx1bMNoS42_W7M",
authDomain: "break-the-block-9cf31.firebaseapp.com",
databaseURL: "https://break-the-block-9cf31-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId: "break-the-block-9cf31",
storageBucket: "break-the-block-9cf31.firebasestorage.app",
messagingSenderId: "365692406347",
appId: "1:365692406347:web:0540f4cb2eb829c0a31bce",
measurementId: "G-FXRV6PBE3Q"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
let score = 0; let userName = "";
let x = canvas.width/2; let y = canvas.height-30;
let dx = 2; let dy = -2;
let paddleHeight = 10; let paddleWidth = 75; let paddleX = (canvas.width-paddleWidth)/2;

document.getElementById("start-btn").onclick = function() {
userName = document.getElementById("username").value;
if(userName) {
document.getElementById("login-section").style.display = "none";
canvas.style.display = "block";
draw();
} else { alert("이름을 입력해주세요!"); }
};

function draw() {
ctx.clearRect(0, 0, canvas.width, canvas.height);
ctx.beginPath(); ctx.arc(x, y, 10, 0, Math.PI*2); ctx.fillStyle = "#0095DD"; ctx.fill(); ctx.closePath();
ctx.beginPath(); ctx.rect(paddleX, canvas.height-paddleHeight, paddleWidth, paddleHeight); ctx.fillStyle = "#0095DD"; ctx.fill(); ctx.closePath();

if(x + dx > canvas.width-10 || x + dx < 10) dx = -dx;
if(y + dy < 10) dy = -dy;
else if(y + dy > canvas.height-10) {
if(x > paddleX && x < paddleX + paddleWidth) dy = -dy;
else {
alert("게임 오버! 점수: " + score);
push(ref(db, 'scores'), { username: userName, score: score, date: Date.now() });
document.location.reload(); return;
}
}
x += dx; y += dy;
requestAnimationFrame(draw);
}
</script>
</body>
</html>
